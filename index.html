<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentShare Pro | Enterprise Community Platform</title>
    <meta name="description" content="Gestión profesional de alquileres comunitarios con seguridad JWT y escalabilidad.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="logo">RentShare <span style="font-size: 0.8rem; font-weight: 400; opacity: 0.7;">PRO</span></div>
        <div id="navActions">
            <button id="logoutBtn" class="btn" style="display: none; color: var(--error); border: 1px solid var(--error);">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <!-- Auth Section -->
        <section id="authSection" class="grid" style="margin-top: 2rem;">
            <div class="card">
                <h2>Iniciar Sesión</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="loginEmail" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="loginPassword" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                </form>
            </div>

            <div class="card">
                <h2>Registrarse</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" name="regNombre" required placeholder="Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="regEmail" required placeholder="juan@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="regPassword" required placeholder="Mín. 6 caracteres">
                    </div>
                    <!-- RECAPTCHA WIDGET -->
                    <div class="g-recaptcha" data-sitekey="6LdJEdMsAAAAAG5eKPxMPgmu4jzcGzqFOsr2vkNp" style="margin-bottom: 1.5rem;"></div>
                    
                    <button type="submit" class="btn btn-block" style="background: var(--glass-border); color: white;">Crear Cuenta</button>
                </form>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboardSection" style="display: none;">
            <header class="header-section">
                <h1 id="userDisplayName">Panel de Administración</h1>
                <p>Gestión de usuarios y métricas de la plataforma.</p>
            </header>

            <main class="grid">
                <section class="card" style="grid-column: 1 / -1;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2>Usuarios Registrados (Paginado)</h2>
                        <button id="refreshBtn" class="btn btn-primary">Actualizar</button>
                    </div>
                    <div id="loading" style="text-align: center; color: var(--text-muted); display: none;">Cargando...</div>
                    <ul id="userList" class="user-list">
                        <!-- Inyectado por JS -->
                    </ul>
                </section>
            </main>
        </section>

    </div>

    <!-- Toast -->
    <div id="status"></div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>

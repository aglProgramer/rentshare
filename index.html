<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <meta name="description" content="Gestiona los gastos de renta con tus compañeros de forma fácil y transparente."/>
  <title>RentShare — Iniciar sesión / Registrarse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6Lfrd-EsAAAAADV0hu4mT3ztOeJk8fZfmdO838JW"></script>

  <script id="tailwind-config">
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; background:var(--color-background); color:var(--color-on-surface); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; user-select:none; }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen">

<!-- AUTH (Login / Registro) - esta será la página principal (index) -->
<section id="authSection" class="min-h-screen flex items-center justify-center p-margin-mobile relative overflow-hidden" style="background:var(--color-background);">
  <div class="absolute top-0 left-0 w-96 h-96 bg-gradient-to-br from-indigo-500/20 to-transparent rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-gradient-to-tl from-purple-500/15 to-transparent rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-500/20 border border-indigo-500/30 mb-4">
        <span class="material-symbols-outlined text-3xl text-indigo-400">home_work</span>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight" style="background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">RentShare</h1>
      <p class="text-slate-400 mt-1 text-sm">Controla los gastos de tu renta con tu grupo.</p>
    </div>

    <div class="auth-tabs flex gap-1 p-1 rounded-xl mb-4" style="background:rgba(15,23,42,0.7);border:1px solid rgba(99,102,241,0.15);">
      <button class="tab-btn active flex-1 py-2 rounded-lg text-sm font-semibold transition-all" id="tabLoginBtn">Iniciar Sesión</button>
      <button class="tab-btn flex-1 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400" id="tabRegisterBtn">Registrarse</button>
    </div>

    <div id="loginPanel" class="glass-card rounded-2xl p-8">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Email</label>
          <input type="email" name="loginEmail" required placeholder="tu@email.com" autocomplete="email"
                 class="w-full px-4 py-3 rounded-xl text-sm text-white placeholder-slate-600 outline-none transition-all"
                 style="background:rgba(10,15,30,0.9);border:1px solid rgba(99,102,241,0.2);"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Contraseña</label>
          <input type="password" name="loginPassword" required placeholder="••••••••" autocomplete="current-password"
                 class="w-full px-4 py-3 rounded-xl text-sm text-white placeholder-slate-600 outline-none transition-all"
                 style="background:rgba(10,15,30,0.9);border:1px solid rgba(99,102,241,0.2);"/>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Entrar</button>
      </form>
    </div>

    <div id="registerPanel" class="glass-card rounded-2xl p-8" style="display:none;">
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Nombre Completo</label>
          <input type="text" name="regNombre" required placeholder="Juan Pérez" autocomplete="name" class="w-full px-4 py-3 rounded-xl text-sm text-white" style="background:rgba(10,15,30,0.9);border:1px solid rgba(99,102,241,0.2);"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Email</label>
          <input type="email" name="regEmail" required placeholder="juan@email.com" autocomplete="email" class="w-full px-4 py-3 rounded-xl text-sm text-white" style="background:rgba(10,15,30,0.9);border:1px solid rgba(99,102,241,0.2);"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Contraseña</label>
          <input type="password" name="regPassword" required placeholder="Mínimo 6 caracteres" autocomplete="new-password" class="w-full px-4 py-3 rounded-xl text-sm text-white" style="background:rgba(10,15,30,0.9);border:1px solid rgba(99,102,241,0.2);"/>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Crear Cuenta</button>
      </form>
    </div>
  </div>
</section>

<!-- Toast + Loading -->
<div id="status" class="toast fixed bottom-24 lg:bottom-8 right-4 lg:right-8 z-[1000] rounded-xl font-semibold text-sm px-4 py-3 shadow-xl border hidden" role="alert" aria-live="polite"></div>
<div id="loading-overlay" class="loading-overlay fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[999]" style="display:none;"><div class="spinner w-12 h-12 rounded-full border-[3px] border-primary/20 border-t-primary animate-spin"></div></div>

<script>
  // Dark/Light mode helper (minimal para auth)
  const html = document.documentElement;
  const savedTheme = localStorage.getItem('rentshare_theme') || 'light';
  function applyTheme(theme){ if(theme==='dark') html.classList.add('dark'); else html.classList.remove('dark'); localStorage.setItem('rentshare_theme', theme); }
  applyTheme(savedTheme);
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
